name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # 测试只直接依赖 @deepseek-ai/cordis（Service / ctx.reflect）。
      # dsh-tools 与 schemastery 是 optional peer，只有 index.js 用得到，测试不加载。
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm install --no-audit --no-fund --no-save @deepseek-ai/cordis@4.0.5

      - name: Smoke tests
        run: |
          node scripts/eng-smoke.mjs
          node scripts/integration-smoke.mjs
          node scripts/variation-gate-smoke.mjs

  package:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Assert npm tarball is installable and self-contained
        run: PB_SKIP_INSTALL=1 node scripts/pack-check.mjs
