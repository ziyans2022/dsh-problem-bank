- insert:
    - id: problem-bank
      name: './lib/index.js'
      config:
        bankRoot: './problem-bank-data'
        idPrefix: 'ZH'
        autoGitCommit: false
        requireHumanReview: true
        defaultDifficulty: 3
        nearDuplicateThreshold: 0.75
